name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # pinned (judge #18144): the box runs 1.3.14
      - run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun test tests/*.test.ts
      # Drift guards: committed generated output must match its source (release.yml only
      # caught stale dist at tag time).
      - name: dist is up to date
        # porcelain, not diff: a build that emits a NEW file leaves it untracked, which diff ignores
        run: bun run build && test -z "$(git status --porcelain dist)" || { git status --porcelain dist; exit 1; }
      - name: Python assets are up to date
        run: bun tools-gen-python-assets.ts && test -z "$(git status --porcelain python)" || { git status --porcelain python; exit 1; }
      # Note: detection examples need a GPU and a clean IP, so they run locally, not here.
      # See examples/detect.ts and hardtargets.ts.

  # Real-Chrome job. The integration test files are `describe.skipIf(!!process.env.CI)`;
  # GitHub sets CI=true, so this job overrides it to empty (falsy) to run them, and
  # tests/mcp-attach-e2e.test.ts (the MCP attach path) runs here too.
  browser:
    runs-on: ubuntu-latest
    env:
      CI: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14  # pinned (judge #18144): the box runs 1.3.14
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      # setup-chrome unpacks chrome-sandbox unprivileged; Chrome then aborts at launch
      # ("chrome-sandbox is owned by root and has mode 4755"), failing every browser test.
      - name: Make chrome-sandbox setuid root
        run: |
          sb="$(dirname "${{ steps.chrome.outputs.chrome-path }}")/chrome-sandbox"
          sudo chown root:root "$sb" && sudo chmod 4755 "$sb"
      - run: bun install
      - name: Browser tests (xvfb)
        env:
          VEIL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          VEIL_REQUIRE_CHROME: "1"  # tests that skip without Chrome FAIL instead, in this job
        run: xvfb-run -a bun test tests/*.test.ts
